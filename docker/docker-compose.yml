services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    profiles: ['cache']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: dev
    ports:
      - 3000:3000
    env_file:
      - ../.env.development.local
      - ../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-supersecret-supersecret-supersecret-supersecret}
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      ADMIN_SEED_KEY: ${ADMIN_SEED_KEY:-seed-admin-2024}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@khulnasoft.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_PHONE: ${ADMIN_PHONE:-+8801784176442}
      ADMIN_NAME: ${ADMIN_NAME:-Demo Admin}
    depends_on:
      db:
        condition: service_healthy
    command: pnpm dev --hostname 0.0.0.0
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next

volumes:
  db-data:
