name: CI

on:
  push:
    branches: [main, 'v0/**', 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm exec next typegen && pnpm typecheck
      - name: Run tests
        run: pnpm test -- --coverage
      - name: Build (Next.js)
        run: pnpm build
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-placeholder-secret-minimum-thirty-two-chars' }}
          NODE_ENV: production

  storybook:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  migrate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
